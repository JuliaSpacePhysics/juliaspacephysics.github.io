name: Devcontainer image

on:
  push:
    branches: [main]
    paths: [.devcontainer/Dockerfile, .devcontainer/Project.toml, .devcontainer/startup.jl, .github/workflows/devcontainer.yml]
  schedule:
    - cron: '0 6 1 * *' # pick up new package releases
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:.devcontainer"
          push: true
          tags: ghcr.io/juliaspacephysics/tutorials-devcontainer:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
