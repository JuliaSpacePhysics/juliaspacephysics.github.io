# Reference: https://github.com/TuringLang/docs/blob/main/.github/workflows/preview.yml
name: PR Preview Workflow

# Fork PRs run with a read-only token, so they only build; same-repo authors can push anyway,
# so their PR code may run with the write token that deploys the preview.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Closing a PR also cancels its build in progress, which would otherwise redeploy after cleanup.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      JULIA_CPU_TARGET: haswell
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: julia-actions/setup-julia@v2
      - uses: julia-actions/cache@v2
      # Tutorials with their own Project.toml run in that env; Manifests are gitignored.
      - name: Instantiate Julia environments
        env:
          JULIA_PKG_PRECOMPILE_AUTO: 0
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.resolve()'
          for p in tutorials/*/Project.toml; do julia --project="$(dirname "$p")" -e 'using Pkg; Pkg.instantiate()'; done

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "pre-release"

      - run: quarto --version

      - name: Render Quarto site
        run: quarto render

      - name: Deploy to GitHub Pages
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          target-folder: pr-previews/${{ github.event.pull_request.number }}
          clean: false
          commit-message: Deploy preview for PR ${{ github.event.pull_request.number }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment Preview URL
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            <!-- preview-url-comment -->
            Preview the changes: https://juliaspacephysics.github.io/pr-previews/${{ github.event.pull_request.number }}
            Please avoid using the search feature and navigation bar in PR previews!
          comment_tag: preview-url-comment

  delete-preview-directory:
    if: github.event.action == 'closed' && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages

      # Races with other pushes to gh-pages, hence the rebase-and-retry.
      - name: Remove PR Preview Directory
        env:
          PREVIEW_DIR: pr-previews/${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -rq --ignore-unmatch "$PREVIEW_DIR"
          git diff --cached --quiet && exit 0
          git commit -qm "Remove preview for PR ${PREVIEW_DIR#pr-previews/}"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin gh-pages && git push -q origin HEAD:gh-pages && exit 0
            sleep $((5 * i))
          done
          exit 1
