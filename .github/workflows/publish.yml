# Reference: https://github.com/TuringLang/turinglang.github.io/blob/main/.github/workflows/publish.yml

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger for testing

concurrency:
  group: docs
  cancel-in-progress: true

name: Deploy to GitHub Pages

jobs:
  build-and-deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      JULIA_CPU_TARGET: haswell
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: julia-actions/setup-julia@v2
      - uses: julia-actions/cache@v2
      # Tutorials with their own Project.toml run in that env; Manifests are gitignored.
      - name: Instantiate Julia environments
        env:
          JULIA_PKG_PRECOMPILE_AUTO: 0
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.resolve()'
          for p in tutorials/*/Project.toml; do julia --project="$(dirname "$p")" -e 'using Pkg; Pkg.instantiate()'; done

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Render Quarto site
        run: quarto render
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site